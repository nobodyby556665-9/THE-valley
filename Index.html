<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>KAMIKAZER - SISTEMA DE CODIGOS</title>
    <style>
        body {
            background-color: #0b020b;
            color: #ff007f;
            font-family: 'Courier New', Courier, monospace;
            padding: 40px;
            text-align: center;
            transition: all 1s ease; /* Transición suave para cuando cambie la página */
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            border: 2px solid #ff007f;
            padding: 30px;
            background-color: #120312;
            box-shadow: 0 0 15px #ff007f;
        }
        input {
            background: #000;
            border: 1px solid #ff007f;
            color: #00ffcc;
            padding: 12px;
            font-family: monospace;
            font-size: 18px;
            outline: none;
            width: 80%;
            text-align: center;
            margin-bottom: 20px;
        }
        button {
            background: #ff007f;
            color: #000;
            border: none;
            padding: 12px 30px;
            cursor: pointer;
            font-weight: bold;
            font-family: monospace;
            font-size: 16px;
            transition: 0.3s;
        }
        button:hover {
            background: #00ffcc;
            box-shadow: 0 0 10px #00ffcc;
        }
        .resultado {
            margin-top: 30px;
            padding: 15px;
            min-height: 50px;
            font-size: 18px;
            line-height: 1.6;
        }
        /* Estilos especiales para la sección de Lost Soul */
        .lostsoul-text {
            color: #d1c7bd;
            text-align: justify;
            font-style: italic;
            background: #1c141c;
            padding: 20px;
            border-left: 4px solid #ff007f;
            margin-bottom: 30px;
        }
        .puzzle-box {
            background: #000;
            border: 1px dashed #00ffcc;
            padding: 20px;
            margin-top: 25px;
        }
        .puzzle-pista {
            color: #00ffcc;
            font-weight: bold;
        }
    </style>
</head>
<body>

<!-- Elemento de audio oculto para el ruido blanco -->
<audio id="ruidoBlanco" loop>
    <source src="https://mixkit.co" type="audio/wav">
    Tu navegador no soporta el elemento de audio.
</audio>

<div class="container" id="cajaPrincipal">
    <h1 id="tituloPestaña">SISTEMA DE VERIFICACIÓN</h1>
    <p id="subtituloPestaña">Ingresa un código de acceso para desbloquear los archivos de "The Pink Valley":</p>
    
    <div id="interaccionBase">
        <input type="text" id="codigoInput" placeholder="SISTEMA_LISTO_">
        <br>
        <button onclick="procesarCodigo()">DECODIFICAR</button>
    </div>
    
    <div id="pantallaResultado" class="resultado">
        <!-- Aquí aparecerán las pistas o el puzzle -->
    </div>
</div>

<script>
function procesarCodigo() {
    var codigo = document.getElementById("codigoInput").value.trim().toLowerCase();
    var pantalla = document.getElementById("pantallaResultado");
    var audio = document.getElementById("ruidoBlanco");
    
    pantalla.innerHTML = "";

    if (codigo === "lostsoul") {
        // 1. Activar el audio de ruido blanco en bucle
        audio.play().catch(function(error) {
            console.log("El navegador bloqueó el auto-play. Se requiere interacción del usuario.");
        });

        // 2. Cambiar la atmósfera de la página
        document.body.style.backgroundColor = "#050505";
        document.getElementById("tituloPestaña").textContent = "ARCHIVO DESENTERRADO: LOST_SOUL";
        document.getElementById("subtituloPestaña").textContent = "Escucha atentamente entre la estática...";
        
        // Ocultar la barra de búsqueda original para que se concentren en el texto
        document.getElementById("interaccionBase").style.display = "none";

        // 3. Insertar el texto cifrado y el Puzzle
        pantalla.innerHTML = `
            <div class="lostsoul-text">
                "Uhfruur od phpruld gh pl sdvdgr hq vx wrwdolgdg, b qr sxhgr hylwdu suhjxqwduph: ¿sru txé kh ylylgr?<br>
                ¿Sdud txé sursóvlwr qdfí?<br>
                Suredeohphqwh kxer xqr dojxqd yhc, b suredeohphqwh wxyh xqd yrfdflóq hohydgd, srutxh vlhqwr xqd ixhucd lolplwdgd hq pl dopd, shur qr dglylqé hvwd yrfdflóq.<br>
                Ph ghmé oohydu sru odv whqwdflrqhv gh od sdvlóq, ydfídv b vlq uhfrpshqvd.<br>
                Pl mxyhqwxg vrpeuíd wudqvfxuuló hq frqiolfwr frqpljr plvpr b frq wrgrv dtxhoorv txh ph urghdedq, b, whplhqgr ho ulgífxor, hqwhuué plv phmruhv vhqwlplhqwrv hq or páv surixqgr gh pl frudcóq, b dooí pxulhurq."
            </div>

            <div class="puzzle-box">
                <h3>[ACERTIJO DEL ALMA PERDIDA]</h3>
                <p>Para obtener las letras ocultas del mapa, resuelve la siguiente pregunta:</p>
                <p class="puzzle-pista">"Tengo llaves pero no abro cerraduras, tengo espacio pero no tengo habitaciones, puedes entrar pero no puedes salir. ¿Qué soy?"</p>
                <input type="text" id="respuestaPuzzle" placeholder="Tu respuesta..." style="width: 60%; font-size: 16px;"><br>
                <button onclick="verificarPuzzle()">ENVIAR RESPUESTA</button>
                <div id="resultadoPuzzle" style="margin-top: 15px; font-weight: bold;"></div>
            </div>
        `;
    
    } else if (codigo === "98472") {
        pantalla.innerHTML = "<p style='color: #00ffcc;'>[ACCESO CONCEDIDO]<br>Pista: Busca el archivo oculto en el servidor. El siguiente código empieza con 'lost'.</p>";
    
    } else if (codigo === "pinkvalley") {
        pantalla.innerHTML = "<p>Código correcto. Archivo redirigido:<br><br><a href='https://google.com' target='_blank'>Ir a KAMIKAZER SITE ➔</a></p>";
    
    } else if (codigo === "") {
        pantalla.innerHTML = "<p style='color: #ffff00;'>Por favor, ingresa un código en la terminal.</p>";
    
    } else {
        pantalla.innerHTML = "<p style='color: #ff0000;'>[ERROR] CÓDIGO INVÁLIDO. Acceso denegado.</p>";
    }
}

function verificarPuzzle() {
    var respuesta = document.getElementById("respuestaPuzzle").value.trim().toLowerCase();
    var resultado = document.getElementById("resultadoPuzzle");

    // La respuesta al acertijo es "teclado" o "el teclado"
    if (respuesta === "teclado" || respuesta === "el teclado") {
        resultado.style.color = "#00ffcc";
        resultado.innerHTML = "¡CORRECTO!<br>Las letras obtenidas son: <span style='font-size: 24px; color: #fff; background: #ff007f; padding: 2px 8px;'>K - A - M</span>.<br>Úsalas sabiamente.";
    } else {
        resultado.style.color = "#ff0000";
        resultado.textContent = "RESPUESTA INCORRECTA. La estática se vuelve más fuerte...";
    }
}
</script>

</body>
</html>
