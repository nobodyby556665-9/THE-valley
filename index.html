<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAMIKAZER - Sistema de Códigos</title>
    <style>
        /* Estilos estilo Terminal Cyberpunk / Hacker */
        body {
            background-color: #050505;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .terminal-container {
            background-color: #000;
            border: 2px solid #00ff41;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
            padding: 30px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            border-radius: 5px;
        }

        .header {
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 0.8rem;
            color: #008f11;
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 1rem;
            margin-bottom: 15px;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .input-code {
            background-color: #050505;
            border: 1px solid #00ff41;
            color: #00ff41;
            padding: 12px;
            font-size: 1.1rem;
            font-family: inherit;
            text-align: center;
            width: 80%;
            margin-bottom: 20px;
            outline: none;
            text-transform: uppercase;
        }

        .input-code:focus {
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
        }

        .btn-decode {
            background-color: #00ff41;
            color: #000;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-decode:hover {
            background-color: #000;
            color: #00ff41;
            border: 1px solid #00ff41;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.4);
        }
    </style>
</head>
<body>

    <div class="terminal-container">
        <div class="header">KAMIKAZER</div>
        <div class="subtitle">[ SISTEMA DE CODIGOS ]</div>

        <hr style="border-color: #008f11; margin-bottom: 25px;">

        <div class="section-title"># SISTEMA DE VERIFICACIÓN</div>
        <p style="font-size: 0.9rem; color: #888;">Ingresa un código de acceso para desbloquear los archivos:</p>

        <!-- Formulario de entrada -->
        <input type="text" id="codigo-input" class="input-code" placeholder="EJ: KEY-9999" autocomplete="off">
        <br>
        <button id="btn-decodificar" class="btn-decode">DECODIFICAR</button>
    </div>

    <!-- ELEMENTOS DE AUDIO (Ocultos) -->
    <!-- Reemplaza "audio/click.mp3" y "audio/success.mp3" por las rutas reales de tus archivos en tu repositorio -->
    <audio id="sound-click" src="audio/click.mp3" preload="auto"></audio>
    <audio id="sound-success" src="audio/success.mp3" preload="auto"></audio>

    <script>
        // Selección de elementos del DOM
        const botonDecodificar = document.getElementById('btn-decodificar');
        const inputCodigo = document.getElementById('codigo-input');
        
        const soundClick = document.getElementById('sound-click');
        const soundSuccess = document.getElementById('sound-success');

        // 1. Efecto de sonido al escribir en el teclado (Opcional, estilo máquina de escribir)
        inputCodigo.addEventListener('keypress', () => {
            soundClick.currentTime = 0;
            soundClick.play().catch(err => console.log("Audio esperando interacción inicial"));
        });

        // 2. Acción y sonido principal al hacer clic en DECODIFICAR
        botonDecodificar.addEventListener('click', () => {
            const codigo = inputCodigo.value.trim();

            if (codigo === "") {
                // Si está vacío, solo suena el clic básico
                soundClick.currentTime = 0;
                soundClick.play();
                alert("Por favor, ingresa un código.");
            } else {
                // Si el usuario escribió algo, reproduce el sonido de éxito/decodificación
                soundSuccess.currentTime = 0;
                soundSuccess.play().catch(error => {
                    console.error("Error al reproducir el audio:", error);
                });

                // Aquí puedes agregar tu lógica para validar códigos en el futuro
                console.log("Código enviado para decodificación: " + codigo);
            }
        });
    </script>

</body>
</html>
