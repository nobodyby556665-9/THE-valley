<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Pink Valley :: WebAssembly Runner</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #ff0055;
            font-family: monospace;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 15, 15, 0.95);
            border: 2px solid #ff0055;
            padding: 30px;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
            z-index: 100;
        }
        input, button {
            background: #1a1a1a;
            color: #ff0055;
            border: 1px solid #ff0055;
            padding: 10px;
            margin: 10px 0;
            font-family: monospace;
            cursor: pointer;
        }
        button:hover {
            background: #ff0055;
            color: #000;
        }
        canvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }
    </style>
</head>
<body>

    <div id="loader">
        <h2>[DARKCODE] THE PINK VALLEY</h2>
        <p>Selecciona tus archivos para inicializar el entorno WASM</p>
        <label>IWAD (doom2.wad):</label><br>
        <input type="file" id="wad-file" accept=".wad"><br>
        <label>Mod (pink_valley.pk3):</label><br>
        <input type="file" id="pk3-file" accept=".pk3"><br><br>
        <button id="launch-btn">EJECUTAR EN NAVEGADOR</button>
    </div>

    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

    <!-- Script del motor WASM (requiere gzdoom.js generado por Emscripten) -->
    <script src="gzdoom.js"></script>
    <script>
        document.getElementById('launch-btn').addEventListener('click', async () => {
            const wadInput = document.getElementById('wad-file').files[0];
            const pk3Input = document.getElementById('pk3-file').files[0];

            if (!wadInput || !pk3Input) {
                alert("Error: Se requieren tanto el archivo .wad como el .pk3 del mod.");
                return;
            }

            const wadBuffer = new Uint8Array(await wadInput.arrayBuffer());
            const pk3Buffer = new Uint8Array(await pk3Input.arrayBuffer());

            document.getElementById('loader').style.display = 'none';

            window.Module = {
                canvas: document.getElementById('canvas'),
                arguments: ['-iwad', 'doom2.wad', '-file', 'pink_valley.pk3'],
                preRun: [function() {
                    Module.FS.createDataFile('/', 'doom2.wad', wadBuffer, true, true);
                    Module.FS.createDataFile('/', 'pink_valley.pk3', pk3Buffer, true, true);
                }],
                print: (text) => console.log(`[WASM STDOUT]: ${text}`),
                printErr: (text) => console.error(`[WASM STDERR]: ${text}`)
            };

            if (typeof runGZDoom === 'function') {
                runGZDoom();
            }
        });
    </script>
</body>
</html>
