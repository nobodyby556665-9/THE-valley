<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAMIKAZER - Sistema de Códigos</title>
    <style>
        /* Estilos estilo Terminal Hacker */
        body {
            background-color: #050505;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .terminal-container {
            background-color: #000;
            border: 2px solid #00ff41;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
            padding: 30px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            border-radius: 5px;
        }

        .header {
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 0.8rem;
            color: #008f11;
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 1rem;
            margin-bottom: 15px;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .input-code {
            background-color: #050505;
            border: 1px solid #00ff41;
            color: #00ff41;
            padding: 12px;
            font-size: 1.1rem;
            font-family: inherit;
            text-align: center;
            width: 80%;
            margin-bottom: 20px;
            outline: none;
            text-transform: uppercase;
        }

        .input-code:focus {
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
        }

        .btn-decode {
            background-color: #00ff41;
            color: #000;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-decode:hover {
            background-color: #000;
            color: #00ff41;
            border: 1px solid #00ff41;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.4);
        }
    </style>
</head>
<body>

    <div class="terminal-container">
        <div class="header">KAMIKAZER</div>
        <div class="subtitle">[ SISTEMA DE CODIGOS ]</div>

        <hr style="border-color: #008f11; margin-bottom: 25px;">

        <div class="section-title"># SISTEMA DE VERIFICACIÓN</div>
        <p style="font-size: 0.9rem; color: #888;">Ingresa un código de acceso para desbloquear los archivos:</p>

        <!-- Formulario de entrada -->
        <input type="text" id="codigo-input" class="input-code" placeholder="INGRESAR CÓDIGO" autocomplete="off">
        <br>
        <button id="btn-decodificar" class="btn-decode">DECODIFICAR</button>
    </div>

    <!-- ETIQUETA DE AUDIO CON TU MÚSICA -->
    <!-- Nota: He puesto 'menu.mp3' asumiendo que renombraste tu archivo para evitar errores de ruta -->
    <audio id="musica-menu" src="menu.mp3" preload="auto" loop></audio>

    <script>
        const botonDecodificar = document.getElementById('btn-decodificar');
        const miMusica = document.getElementById('musica-menu');
        let reproduciendo = false;

        // Al hacer clic en DECODIFICAR se activará tu canción de fondo (y se mantendrá en bucle)
        botonDecodificar.addEventListener('click', () => {
            if (!reproduciendo) {
                miMusica.play()
                    .then(() => {
                        reproduciendo = true;
                        console.log("Reproduciendo la OST de tu menú con éxito.");
                    })
                    .catch(error => {
                        console.error("El navegador bloqueó el audio inicial de la página:", error);
                    });
            }
            
            // Aquí puedes colocar el resto de la lógica de tus códigos
        });
    </script>

</body>
</html>
